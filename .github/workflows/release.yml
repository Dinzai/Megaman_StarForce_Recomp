name: Release APK
# Push a tag like v0.5.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.5.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Version from tag
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( ($(git log -1 --format=%ct) - 1704067200) / 60 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Optional private signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon \
            -PsfVersionName=${{ steps.v.outputs.name }} -PsfVersionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "StarForceRecomp-${{ steps.v.outputs.tag }}.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.v.outputs.tag }}
          NOTES=""
          if [ -f "docs/releases/$TAG.md" ]; then NOTES="--notes-file docs/releases/$TAG.md"; else NOTES="--generate-notes"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "StarForceRecomp-$TAG.apk" --clobber
          else
            gh release create "$TAG" "StarForceRecomp-$TAG.apk" --title "Star Force Recomp $TAG" $NOTES --prerelease
          fi
