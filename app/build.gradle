plugins { id 'com.android.application' }

android {
    namespace 'io.dinzai.starforce'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.dinzai.starforce'
        minSdk 26
        targetSdk 35
        // CI passes -PsfVersionName (git tag or dev label) and -PsfVersionCode (minutes since
        // 2024-01-01 of the commit), so every build, dev or release, upgrades the previous one.
        versionName project.findProperty('sfVersionName') ?: '0.5.0-local'
        versionCode((project.findProperty('sfVersionCode') ?: '1').toInteger())
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                // Optional: -PmelonDSDir=/path/to/melonDS builds offline from a local checkout.
                if (project.hasProperty('melonDSDir')) arguments "-DMELONDS_SOURCE_DIR=${project.property('melonDSDir')}"
            }
        }
    }
    signingConfigs {
        // Stable signing so updates install over older builds (see signing/README.md).
        stable {
            def ks = System.getenv('SIGNING_KEYSTORE_FILE')
            storeFile file(ks ?: "${rootDir}/signing/test-signing.keystore")
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'sfrecomp-test'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'sfrecomp'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'sfrecomp-test'
        }
    }
    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildTypes {
        // Debug builds of the emulator core are too slow to play; optimise native code in both.
        debug {
            signingConfig signingConfigs.stable
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
